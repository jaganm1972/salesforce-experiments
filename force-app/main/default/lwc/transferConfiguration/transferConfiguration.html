<template>
    <lightning-card title="Transfer Requests">
        <div class="slds-var-p-around_medium">

            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-var-m-bottom_small" role="alert">
                    {error}
                </div>
            </template>

            <!-- ── FORM MODE ── -->
            <template lwc:if={isFormMode}>

                <!-- Transfer Date -->
                <div class="slds-var-m-bottom_medium">
                    <lightning-input
                        type="date"
                        label="Transfer Date"
                        value={transferDate}
                        onchange={handleTransferDateChange}
                        required
                    ></lightning-input>
                </div>

                <!-- Column headers — only shown once rows exist -->
                <template lwc:if={hasTransferRows}>
                    <div class="slds-grid slds-gutters_x-small slds-var-m-bottom_xx-small">
                        <div class="slds-col slds-size_4-of-12">
                            <span class="slds-text-body_small slds-text-color_weak">Source Account</span>
                        </div>
                        <div class="slds-col slds-size_4-of-12">
                            <span class="slds-text-body_small slds-text-color_weak">Destination Account</span>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <span class="slds-text-body_small slds-text-color_weak">Amount</span>
                        </div>
                        <div class="slds-col slds-grow-none" style="width:2rem;"></div>
                    </div>
                </template>

                <!-- Transfer rows -->
                <template for:each={displayRows} for:item="row">
                    <div key={row._key} class="slds-box slds-box_x-small slds-var-m-bottom_x-small">
                        <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-start">

                            <!-- Source -->
                            <div class="slds-col slds-size_4-of-12">
                                <lightning-combobox
                                    label="Source account"
                                    variant="label-hidden"
                                    placeholder="Select source..."
                                    options={row.sourceOptions}
                                    value={row.sourceAccountId}
                                    data-key={row._key}
                                    onchange={handleSourceChange}
                                ></lightning-combobox>
                            </div>

                            <!-- Destination -->
                            <div class="slds-col slds-size_4-of-12">

                                <!-- Combobox: shown unless an external account is locked in -->
                                <template lwc:if={row.showDestCombo}>
                                    <lightning-combobox
                                        label="Destination account"
                                        variant="label-hidden"
                                        placeholder="Select destination..."
                                        options={row.destOptions}
                                        value={row.destComboValue}
                                        data-key={row._key}
                                        onchange={handleDestChange}
                                    ></lightning-combobox>
                                </template>

                                <!-- Search input — shown when "Other" is active but no external account picked yet -->
                                <template lwc:if={row.showDestSearch}>
                                    <lightning-input
                                        type="search"
                                        label="Search external account"
                                        variant="label-hidden"
                                        placeholder="Search by name or account number..."
                                        value={row.destSearchTerm}
                                        data-key={row._key}
                                        onchange={handleDestSearchTermChange}
                                        class="slds-var-m-top_x-small"
                                    ></lightning-input>

                                    <template lwc:if={row.hasDestSearchResults}>
                                        <ul class="slds-listbox slds-listbox_vertical slds-box slds-box_x-small slds-var-m-top_xx-small" role="listbox">
                                            <template for:each={row.destSearchResults} for:item="result">
                                                <li key={result.id} class="slds-listbox__item" role="presentation">
                                                    <div
                                                        class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                                                        role="option"
                                                        data-key={row._key}
                                                        data-id={result.id}
                                                        onclick={handleSelectDestSearchResult}
                                                    >
                                                        <span class="slds-media__body">
                                                            <span class="slds-truncate">{result.displayLabel}</span>
                                                        </span>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>
                                </template>

                                <!-- Locked external account — shown once an "Other" account is selected -->
                                <template lwc:if={row.showDestExternalChip}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
                                        <div class="slds-col slds-truncate">
                                            <p class="slds-text-body_regular slds-truncate">{row.destExternalName}</p>
                                            <p class="slds-text-body_small slds-text-color_weak">****{row.destExternalLastFour}</p>
                                        </div>
                                        <div class="slds-col slds-grow-none">
                                            <lightning-button-icon
                                                icon-name="utility:close"
                                                variant="bare"
                                                size="small"
                                                alternative-text="Change destination account"
                                                title="Change destination"
                                                data-key={row._key}
                                                onclick={handleClearExternalDest}
                                            ></lightning-button-icon>
                                        </div>
                                    </div>
                                </template>

                            </div>

                            <!-- Amount -->
                            <div class="slds-col slds-size_3-of-12">
                                <lightning-input
                                    type="number"
                                    label="Amount"
                                    variant="label-hidden"
                                    value={row.amount}
                                    formatter="currency"
                                    step="0.01"
                                    data-key={row._key}
                                    onchange={handleAmountChange}
                                ></lightning-input>
                            </div>

                            <!-- Delete row -->
                            <div class="slds-col slds-grow-none" style="width:2rem;">
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    variant="bare"
                                    size="small"
                                    alternative-text="Remove transfer row"
                                    title="Remove row"
                                    data-key={row._key}
                                    onclick={handleRemoveRow}
                                ></lightning-button-icon>
                            </div>

                        </div>
                    </div>
                </template>

                <!-- Add row + form actions -->
                <div class="slds-grid slds-grid_align-spread slds-var-m-top_small">
                    <lightning-button
                        label="+ Add Transfer Row"
                        onclick={handleAddRow}
                        disabled={isLoading}
                    ></lightning-button>
                    <div class="slds-button-group">
                        <lightning-button
                            label="Save as Draft"
                            onclick={handleSaveDraft}
                            disabled={isLoading}
                        ></lightning-button>
                        <lightning-button
                            label="Submit"
                            variant="brand"
                            onclick={handleSubmit}
                            disabled={isLoading}
                        ></lightning-button>
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancel}
                            disabled={isLoading}
                        ></lightning-button>
                    </div>
                </div>

            </template>

            <!-- ── LIST MODE ── -->
            <template lwc:else>

                <template lwc:if={hasTransferSummary}>

                    <!-- Transfer date and status -->
                    <div class="slds-grid slds-gutters slds-var-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-body_small slds-text-color_weak">Transfer Date</p>
                            <p class="slds-text-heading_small">
                                <lightning-formatted-date-time
                                    value={summary.transferDate}
                                    year="numeric"
                                    month="long"
                                    day="2-digit"
                                ></lightning-formatted-date-time>
                            </p>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-text-body_small slds-text-color_weak">Status</p>
                            <lightning-badge label={summary.status}></lightning-badge>
                        </div>
                    </div>

                    <!-- Per-row summary table -->
                    <div class="slds-var-m-bottom_medium">
                        <div class="slds-grid slds-gutters_x-small slds-var-m-bottom_xx-small">
                            <div class="slds-col slds-size_4-of-12">
                                <span class="slds-text-body_small slds-text-color_weak">Source</span>
                            </div>
                            <div class="slds-col slds-size_4-of-12">
                                <span class="slds-text-body_small slds-text-color_weak">Destination</span>
                            </div>
                            <div class="slds-col slds-size_4-of-12 slds-text-align_right">
                                <span class="slds-text-body_small slds-text-color_weak">Amount</span>
                            </div>
                        </div>
                        <template for:each={summary.rows} for:item="row">
                            <div key={row.rowKey} class="slds-grid slds-gutters_x-small slds-var-p-vertical_x-small slds-border_bottom">
                                <div class="slds-col slds-size_4-of-12">
                                    <p class="slds-text-body_regular slds-truncate">{row.sourceName}</p>
                                    <p class="slds-text-body_small slds-text-color_weak">****{row.sourceLastFour}</p>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <p class="slds-text-body_regular slds-truncate">{row.destName}</p>
                                    <p class="slds-text-body_small slds-text-color_weak">****{row.destLastFour}</p>
                                </div>
                                <div class="slds-col slds-size_4-of-12 slds-text-align_right">
                                    <lightning-formatted-number
                                        value={row.amount}
                                        format-style="currency"
                                        currency-code="USD"
                                    ></lightning-formatted-number>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- List actions -->
                    <div class="slds-button-group">
                        <lightning-button
                            label="Edit"
                            onclick={handleEdit}
                            disabled={isLoading}
                        ></lightning-button>
                        <lightning-button
                            label="Reset"
                            variant="destructive"
                            onclick={handleReset}
                            disabled={isLoading}
                        ></lightning-button>
                    </div>

                </template>

                <!-- Empty state -->
                <template lwc:else>
                    <div class="slds-align_absolute-center slds-var-p-around_large">
                        <div class="slds-text-align_center">
                            <lightning-icon
                                icon-name="standard:orders"
                                size="large"
                                class="slds-var-m-bottom_small"
                            ></lightning-icon>
                            <p class="slds-text-body_regular slds-var-m-bottom_medium">
                                Specify the transfer request here
                            </p>
                            <lightning-button
                                label="New Transfer Request"
                                variant="brand"
                                onclick={handleNew}
                            ></lightning-button>
                        </div>
                    </div>
                </template>

            </template>

        </div>
    </lightning-card>
</template>
